[entity-description]
eternal-lantern=Декоративный фонарь, который даёт свет и увеличивает эффективность окружающей зоны. Установка более одного не даёт дополнительного бонуса. Не учитывается в лимите маяков.
windmill=Ветряная мельница, которая даёт бонус производительности окружающей зоне. Чем дальше от стартовой зоны, тем сильнее бонус. Максимум +100% производительности.
rockmalt-tree=Имеет скорлупу твёрдую, как камень, но мякоть мягкую, как пудинг.
redbloom-tree=Красная ягода со сладким и слегка пряным вкусом.
mangroove-tree=Цитрусовый фрукт со сладко-кислым вкусом.
nyxoleum-tree=Очень богатое маслом растение, растущее в лужах дёгтя. Его масло настолько чистое, что его даже можно использовать для приготовления пищи.

