[entity-description]
eternal-lantern=A decorative lantern that provides light, while giving efficiency bonus to surrounding area. Placing more than one does not provide additional bonus. Do not count toward beacon limit.
windmill=A windmill that provides productivity bonus to surrounding area. The further away from the starting area, the stronger the bonus. Maximum at +100% productivity.

rockmalt-tree=Have shell hard as rock, but flesh soft as pudding.
redbloom-tree=A red berry with sweet and a slightly spicy taste.
mangroove-tree=A citrus fruit with sweet and sour taste.
nyxoleum-tree=A very oil-rich plant, grows in the tar puddles. Its oil is so clean that it can even use to cook food.